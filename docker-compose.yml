version: "3.9"

services:
  api_a1a:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: qc_api_a1a
    environment:
      path: a1a
    secrets:
      - a1a
    # env_file:
    #   - .env.a1a
    restart: always
    expose:
      - "5008"
    networks:
      - backend

  api_tac:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: qc_api_tac
    environment:
      path: tac
    secrets:
      - tac
    # env_file:
    #   - .env.tac
    restart: always
    expose:
      - "5008"
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: qc_nginx
    ports:
      - "8088:8088"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api_a1a
      - api_tac
    restart: always
    networks:
      - backend

networks:
  backend:

secrets:
  a1a:
    file: .env.a1a
  tac:
    file: .env.tac